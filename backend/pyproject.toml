[project]
name = "baches-backend"
version = "0.1.0"
description = "API for reporting potholes in a city"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework>=3.16",
    "djangorestframework-gis>=1.2",
    "djangorestframework-simplejwt>=5.5",
    "django-cors-headers>=4.9",
    "django-filter>=25.1",
    "psycopg[binary]>=3.2",
    "pillow>=11.0",
    "google-auth>=2.40",
    "requests>=2.32",
    "drf-spectacular>=0.28",
    "django-environ>=0.12",
    "django-jazzmin>=3.0.5",
    "gunicorn>=26.2.0",
    "whitenoise>=6.12.0",
    "langchain-core>=0.3",
    "langchain-google-genai>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-mock>=3.14",
    "ruff>=0.9",
    "pre-commit>=4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
