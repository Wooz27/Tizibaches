services:
  db:
    image: postgis/postgis:18-3.6
    container_name: baches-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baches}
      POSTGRES_USER: ${POSTGRES_USER:-baches}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
      DOMAIN: "${DOMAIN:-localhost}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-http://localhost:${HOST_PORT:-80},http://localhost:4321}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:${HOST_PORT:-80},http://localhost:4321}"
      WEB_URL: "${WEB_URL:-http://localhost:${HOST_PORT:-80}}"
      # El compose local sirve HTTP; en producción HTTPS activa estas flags.
      DJANGO_SECURE_SSL_REDIRECT: "${DJANGO_SECURE_SSL_REDIRECT:-0}"
      DJANGO_SESSION_COOKIE_SECURE: "${DJANGO_SESSION_COOKIE_SECURE:-0}"
      DJANGO_CSRF_COOKIE_SECURE: "${DJANGO_CSRF_COOKIE_SECURE:-0}"
      DJANGO_SECURE_HSTS_SECONDS: "${DJANGO_SECURE_HSTS_SECONDS:-0}"
      DJANGO_TRUST_PROXY: "1"
    volumes:
      - media:/app/media
    ports:
      # Solo accesible desde el host; el tráfico público entra por el proxy.
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health/').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ai-worker:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      AI_VERIFICATION_ENABLED: "1"
    command: ["python", "manage.py", "verify_report_photos", "--loop", "--sleep", "10"]
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        API_URL: http://backend:3000
        PUBLIC_API_URL: "${PUBLIC_API_URL:-http://localhost:${HOST_PORT:-80}}"
        PUBLIC_APP_URL: "${PUBLIC_APP_URL:-/app}"
        PUBLIC_MAP_STYLE_URL: "${PUBLIC_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/positron}"
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
      API_URL: http://backend:3000
    ports:
      # Solo accesible desde el host; el tráfico público entra por el proxy.
      - "127.0.0.1:4321:4321"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4321/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  pgdata:
  media:
