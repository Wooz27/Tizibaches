resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" https;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;
    limit_req_status 429;

    set $api_upstream backend:3000;
    set $web_upstream web:4321;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location = /api/auth/google/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://$api_upstream;
    }

    location = /api/auth/refresh/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://$api_upstream;
    }

    location = /admin/login/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://$api_upstream;
    }

    location /api/ {
        proxy_pass http://$api_upstream;
    }

    location /admin/ {
        proxy_pass http://$api_upstream;
    }

    location /static/ {
        proxy_pass http://$api_upstream;
    }

    location /media/ {
        alias /srv/media/;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # APK de prueba. Distribución temporal hasta que Play Store apruebe.
    # Para retirarlo: quitar este bloque, el montaje en docker-compose.yml y el
    # directorio del host. Ver docs/distribucion-apk.md
    location /releases/ {
        alias /srv/releases/;
        autoindex off;
        default_type application/octet-stream;
        types {
            application/vnd.android.package-archive apk;
        }
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=300" always;
    }

    location / {
        proxy_pass http://$web_upstream;
    }
}
