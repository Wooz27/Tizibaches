resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=15r/s;

# El cliente nunca decide si la petición llegó por HTTPS: Cloudflare termina TLS
# y cloudflared siempre reenvía sobre HTTP interno. Se fija en https.
map $http_x_forwarded_proto $forwarded_proto {
    default https;
    "" https;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;
    limit_req_status 429;

    set $api_upstream backend:3000;
    set $web_upstream web:4321;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;
    # MapLibre necesita blob: para su worker y los tiles se piden a openfreemap.
    # Umami carga su script y envía eventos a su propio host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://umami.casatos.online; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://umami.casatos.online https://*.openfreemap.org; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Se sobrescribe con la IP real resuelta por real_ip_module. Si se usara
    # $proxy_add_x_forwarded_for, el cliente podría inyectar IPs y saltarse
    # los límites de peticiones.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location = /api/auth/google/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://$api_upstream;
    }

    location = /api/auth/refresh/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://$api_upstream;
    }

    location = /admin/login/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://$api_upstream;
    }

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://$api_upstream;
    }

    location /admin/ {
        proxy_pass http://$api_upstream;
    }

    location /static/ {
        proxy_pass http://$api_upstream;
    }

    # Ojo: declarar add_header aquí anula la herencia de los del server.
    # Por eso se repiten los de seguridad.
    location /media/ {
        alias /srv/media/;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    location / {
        limit_req zone=web_limit burst=30 nodelay;
        proxy_pass http://$web_upstream;
    }
}
